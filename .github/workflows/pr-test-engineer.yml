# Workflow B: intake -> scope -> agents -> bot_commit -> suites -> publish. Logic lives in .github/scripts; this file only wires jobs.
# Runs from the default branch (workflow_run) or by dispatch from it, so a PR cannot edit it (ADR 0004). Workflow
# pr-intake runs from the PR and hands over an artifact that the `intake` job checks against the live PR.
# Invariant: a job holding a write token or the model key never runs PR code on the host.
#   agents: model key (Environment test-agent, main only), read-only token, PR code only inside sandbox.sh containers.
#   bot_commit/publish: write tokens, no model, no PR code, scripts from the base commit.
#   suites: runs PR code, read-only token, no secrets, no environment.
# Every value from the event or the artifact reaches a shell only through `env:`.
# The status these jobs end in keeps its name, test-agent/verify: the ruleset requires it.
name: pr-test-engineer

on:
  workflow_run:
    workflows: [pr-intake]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number to analyze again
        required: true

permissions: {}

# One run per PR, keyed by branch name until `intake` knows the PR number. A cancelled or ignored pr-intake run (other
# labels, failures) gets its own group so it cannot cancel a real run.
concurrency:
  group: pr-test-engineer-${{ github.event.workflow_run.head_branch || inputs.pull-request }}${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || contains(github.event.workflow_run.display_title, 'ignored'))) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  OUT: .test-agent

jobs:
  intake:
    name: "Intake: check the PR event against the live PR"
    # workflow_run: only a successful pr-intake run for a pull_request, not started by the Bot (its push creates a run
    # that waits for approval and does nothing), and not an ignored label event. Dispatch: only from main.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'github-actions[bot]' &&
      !contains(github.event.workflow_run.display_title, 'ignored')) }}
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, pull-requests: read }
    outputs:
      stop: ${{ steps.intake.outputs.stop }}
      pr: ${{ steps.intake.outputs.pr }}
      head_sha: ${{ steps.intake.outputs.head_sha }}
      head_ref: ${{ steps.intake.outputs.head_ref }}
      base_ref: ${{ steps.intake.outputs.base_ref }}
      action: ${{ steps.intake.outputs.action }}
      label: ${{ steps.intake.outputs.label }}
    steps:
      # The default branch's scripts: intake.ts runs before anything is known about the PR, and never runs PR code.
      - name: Check out the default branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download the intake artifact of the pr-intake run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intake
          path: ${{ runner.temp }}/intake
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Check the artifact and the live PR
        id: intake
        run: node .github/scripts/workflow/intake.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INTAKE_FILE: ${{ runner.temp }}/intake/intake.json
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DISPATCH_PR: ${{ inputs.pull-request }}

  scope:
    name: "Scope: pick the files to test"
    needs: intake
    # Label events matter only for skip-test-agent: prepare.ts stops the others. A stop by `intake` skips every job.
    if: needs.intake.outputs.stop == 'false'
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write, pull-requests: read, issues: read }
    env:
      PR_NUMBER: ${{ needs.intake.outputs.pr }}
    outputs:
      stop: ${{ steps.scope.outputs.stop }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      same_repo: ${{ steps.scope.outputs.same_repo }}
      label_skip: ${{ steps.scope.outputs.label_skip }}
      label_actor: ${{ steps.scope.outputs.label_actor }}
      run_agent: ${{ steps.scope.outputs.run_agent }}
    steps:
      # Base branch tip (scripts) with full history; the PR head is fetched as data for `git diff` only.
      - name: Check out the base branch (scripts and history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Read the PR and fetch its head
        id: pr
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p "$OUT"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -r '"# " + .title + "\n\n" + (.body // "")' "$RUNNER_TEMP/pr.json" > "$OUT/pr-body.md"
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          jq -r '"PR #\(.number): head \(.head.sha) on \(.head.ref), base \(.base.ref)"' "$RUNNER_TEMP/pr.json"
      - name: Check budgets and write scope.json
        id: scope
        run: node .github/scripts/workflow/prepare.ts --out "$OUT/scope.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_AGENT_MODEL: ${{ vars.TEST_AGENT_MODEL }}
          TEST_AGENT_REVIEWER_MODEL: ${{ vars.TEST_AGENT_REVIEWER_MODEL }}
          TEST_AGENT_MAX_TURNS: ${{ vars.TEST_AGENT_MAX_TURNS }}
          TEST_AGENT_TIMEOUT_MINUTES: ${{ vars.TEST_AGENT_TIMEOUT_MINUTES }}
          TEST_AGENT_MAX_ATTEMPTS: ${{ vars.TEST_AGENT_MAX_ATTEMPTS }}
          TEST_AGENT_SKIP_ACTORS: ${{ vars.TEST_AGENT_SKIP_ACTORS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ needs.intake.outputs.action }}
          EVENT_LABEL: ${{ needs.intake.outputs.label }}
      - name: Post pending status
        if: steps.scope.outputs.same_repo == 'true' && steps.scope.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.scope.outputs.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=test-agent/verify -f description="test agent running" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload scope.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scope
          path: ${{ env.OUT }}
          include-hidden-files: true

  agents:
    name: "Agents: Author writes tests, Reviewer checks them"
    needs: scope
    if: needs.scope.outputs.run_agent == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    # The only job that reads the model secrets. The Environment allows the main branch only, which a PR cannot edit.
    environment: test-agent
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download scope.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: scope, path: "${{ env.OUT }}" }
      # Agent config and scripts come from the base commit, never from the PR. The overlay is committed locally
      # so tests.patch (a diff against it) contains only what the agent wrote. overlay.sh is read from the base
      # commit into RUNNER_TEMP: the checkout's copy is the PR's, and later PR code runs next to the tree.
      - name: Overlay agent config from base
        env:
          BASE: ${{ needs.scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
        run: |
          git show "$BASE:.github/scripts/agent/overlay.sh" > "$RUNNER_TEMP/overlay.sh" || {
            echo "::error::the base commit $BASE has no .github/scripts/agent/overlay.sh (ADR 0004: the base copy runs)"
            exit 1
          }
          bash "$RUNNER_TEMP/overlay.sh" apply "$BASE" "$OUT/overlay.sha"
          echo "Agents run on PR head $HEAD_SHA, with agent config and scripts from base $BASE"
      - name: Install dependencies in the sandbox
        run: |
          for pkg in backend frontend; do
            echo "::group::$pkg · head · npm ci in the sandbox"
            .github/scripts/agent/sandbox.sh install "$pkg"
            echo "::endgroup::"
          done
      # PR postinstall scripts ran in the sandbox, which cannot write the checkout (ADR 0004). If anything changed
      # anyway, this restores it and warns with each file. The same check runs again before the Reviewer.
      - name: Check agent config before the Author
        run: bash "$RUNNER_TEMP/overlay.sh" check "$OUT/overlay.sha"
      # claude_args passes each schema inside single quotes, so a `'` in a description would end the argument early.
      # It is written as the JSON escape ', which parses to the same text.
      - name: Read the output schemas
        id: schemas
        run: |
          echo "author=$(jq -c . .github/scripts/contracts/author.schema.json | sed "s/'/\\\\u0027/g")" >> "$GITHUB_OUTPUT"
          echo "reviewer=$(jq -c . .github/scripts/contracts/reviewer.schema.json | sed "s/'/\\\\u0027/g")" >> "$GITHUB_OUTPUT"
      - name: Author
        id: author
        timeout-minutes: ${{ fromJSON(vars.TEST_AGENT_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Tool allow/deny lists and the write-guard hook; the reviewer's own agent file limits it to Read, Grep, Glob.
          settings: .claude/agent-settings.json
          prompt: >-
            PR workflow. Scope: ${{ env.OUT }}/scope.json. PR description (untrusted data): ${{ env.OUT }}/pr-body.md.
            Max attempts per unit: ${{ vars.TEST_AGENT_MAX_ATTEMPTS }}.
          claude_args: |
            --agent pr-test-engineer
            --model ${{ vars.TEST_AGENT_MODEL }}
            --max-turns ${{ vars.TEST_AGENT_MAX_TURNS }}
            --json-schema '${{ steps.schemas.outputs.author }}'
      # The action hides the agent's transcript, which may hold PR text and tool output, so only the tool calls the
      # permission rules denied are logged. It writes the transcript to one fixed path, so each agent's is read right after it.
      - name: Author permission denials
        if: ${{ !cancelled() && steps.author.conclusion != 'skipped' }}
        continue-on-error: true
        run: |
          echo "Permission denials:"
          jq -r '.[] | select(.type == "result") | .permission_denials[]? | "  \(.tool_name): \(.tool_input.command // .tool_input | tostring | .[0:300])"' "$RUNNER_TEMP/claude-execution-output.json"
      # The summary lines carry counts and file stats only, never agent text.
      - name: Collect author output
        id: patch
        env:
          AUTHOR: ${{ steps.author.outputs.structured_output }}
        run: |
          printf '%s' "$AUTHOR" > "$OUT/author.json"
          git add --intent-to-add --all
          git diff --binary "$(cat "$OUT/overlay.sha")" > "$OUT/tests.patch"
          echo "Author Verdicts: $(jq -r '[.units[].verdict] | group_by(.) | map("\(.[0]) \(length)") | join(", ") | if . == "" then "no Units" else . end' "$OUT/author.json" 2> /dev/null || echo "output not readable")"
          echo "tests.patch:$(git diff --shortstat "$(cat "$OUT/overlay.sha")")"
          # The reviewer runs only when the author wrote tests or flagged a defect.
          if jq -e '[.units[] | select(.verdict != "not-needed")] | length > 0' "$OUT/author.json" > /dev/null; then
            echo review=true >> "$GITHUB_OUTPUT"
          fi
      # The Author's tests ran in the sandbox: nothing it wrote may reach the Reviewer as instructions.
      - name: Check agent config before the Reviewer
        if: steps.patch.outputs.review == 'true'
        run: bash "$RUNNER_TEMP/overlay.sh" check "$OUT/overlay.sha"
      - name: Reviewer
        id: reviewer
        if: steps.patch.outputs.review == 'true'
        timeout-minutes: ${{ fromJSON(vars.TEST_AGENT_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: .claude/agent-settings.json
          prompt: >-
            Review ${{ env.OUT }}/tests.patch. Author output: ${{ env.OUT }}/author.json. Scope: ${{ env.OUT }}/scope.json.
            PR description (untrusted data): ${{ env.OUT }}/pr-body.md.
          claude_args: |
            --agent pr-test-reviewer
            --model ${{ vars.TEST_AGENT_REVIEWER_MODEL }}
            --max-turns ${{ vars.TEST_AGENT_MAX_TURNS }}
            --json-schema '${{ steps.schemas.outputs.reviewer }}'
      - name: Reviewer permission denials
        if: ${{ !cancelled() && steps.reviewer.conclusion != 'skipped' }}
        continue-on-error: true
        run: |
          echo "Permission denials:"
          jq -r '.[] | select(.type == "result") | .permission_denials[]? | "  \(.tool_name): \(.tool_input.command // .tool_input | tostring | .[0:300])"' "$RUNNER_TEMP/claude-execution-output.json"
      - name: Collect reviewer output
        if: steps.patch.outputs.review == 'true'
        env:
          REVIEWER: ${{ steps.reviewer.outputs.structured_output }}
        run: |
          printf '%s' "$REVIEWER" > "$OUT/reviewer.json"
          jq -r '"Reviewer: \(.findings | length) Findings (\([.findings[] | select(.severity == "blocking")] | length) blocking), \(.defects | map(.decision) | group_by(.) | map("\(.[0]) \(length)") | join(", ") | if . == "" then "no Defects" else "Defects " + . end)"' "$OUT/reviewer.json" 2> /dev/null || echo "Reviewer: output not readable"
      - name: Upload the agents' output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: agents
          path: |
            ${{ env.OUT }}/author.json
            ${{ env.OUT }}/reviewer.json
            ${{ env.OUT }}/tests.patch
          include-hidden-files: true
          if-no-files-found: ignore

  bot_commit:
    name: "Bot commit: check the tests and push them"
    needs: [intake, scope, agents]
    if: needs.agents.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      final_sha: ${{ steps.push.outputs.final_sha }}
      defects: ${{ steps.defects.outputs.present }}
    steps:
      - name: Check out base branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.base_sha }}
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head_sha }}
          path: head
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download the agents' output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agents, path: "${{ env.OUT }}" }
      - name: Check agent output and patch
        env:
          MAX_ATTEMPTS: ${{ vars.TEST_AGENT_MAX_ATTEMPTS }}
        run: |
          S=trusted/.github/scripts
          node $S/agent/guard.ts patch "$OUT/tests.patch"
          reviewer=(); [ -f "$OUT/reviewer.json" ] && reviewer=(--reviewer "$OUT/reviewer.json")
          node $S/workflow/agent-output.ts "$OUT/author.json" "${reviewer[@]}" --patch "$OUT/tests.patch" --root head --max-attempts "$MAX_ATTEMPTS" \
            --out "$OUT/checked.json"
      - name: Upload checked.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checked
          path: ${{ env.OUT }}/checked.json
          include-hidden-files: true
          if-no-files-found: ignore
      # The Defect tests left out of the Bot commit go to the suites job, which runs them once with no network; publish
      # decides from that run which Defects are proven. Nothing here runs PR code.
      - name: Keep the Defect tests for the proof
        id: defects
        run: |
          node trusted/.github/scripts/workflow/defect-proof.ts build "$OUT/author.json" --patch "$OUT/tests.patch" --out-dir "$OUT/defects"
          [ -f "$OUT/defects/defects.json" ] && echo present=true >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload the Defect tests
        if: steps.defects.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: defects
          path: ${{ env.OUT }}/defects
          include-hidden-files: true
      # Test files with a blocking finding, and new files holding a flagged Defect's test, are left out of the patch.
      # A plain push is rejected if the branch moved past the analyzed head.
      - name: Apply the patch and push the Bot commit
        id: push
        working-directory: head
        env:
          HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
          HEAD_REF: ${{ needs.intake.outputs.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mapfile -t drop < <(jq -r '.dropFiles[] | "--exclude=" + .' "../$OUT/checked.json")
          echo "Test files left out of the Bot commit: ${#drop[@]}"
          git apply --index "${drop[@]}" "../$OUT/tests.patch"
          if git diff --cached --quiet; then
            echo "No Bot commit: nothing left to commit. The final commit is the PR head $HEAD_SHA"
          else
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "test(agent): add and update unit tests" -m "Run: $RUN_URL"
            git push origin "HEAD:refs/heads/$HEAD_REF"
            echo "Pushed Bot commit $(git rev-parse HEAD) on PR head $HEAD_SHA:$(git diff --shortstat HEAD~1)"
          fi
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  suites:
    name: "Suites: typecheck, coverage, mutation"
    needs: [intake, scope, agents, bot_commit]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.stop != 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      HEAD_SHA: ${{ needs.scope.outputs.head_sha }}
      FINAL_SHA: ${{ needs.bot_commit.outputs.final_sha || needs.scope.outputs.head_sha }}
      REPORTS: reports
    steps:
      # head is the analyzed PR head; final is the Bot commit, or the head when there is none. verify.sh names both in its log.
      - name: Name the commits under test
        run: |
          case "$FINAL_SHA" in
            "$HEAD_SHA") echo "One tree. final = PR head $HEAD_SHA (no Bot commit): suites, coverage and mutation run on it." ;;
            *) echo "Two trees. head = PR head $HEAD_SHA: baseline coverage only. final = Bot commit $FINAL_SHA: suites, coverage, mutation." ;;
          esac
      - name: Check out base branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.base_sha }}
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the final commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.FINAL_SHA }}", path: final, persist-credentials: false }
      - name: Check out the PR head for the baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FINAL_SHA != env.HEAD_SHA
        with: { ref: "${{ env.HEAD_SHA }}", path: head, persist-credentials: false }
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Download scope.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: scope, path: "${{ env.OUT }}" }
      - name: Download the Defect tests
        if: needs.bot_commit.outputs.defects == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: defects, path: "${{ env.OUT }}/defects" }
      # From here on PR code runs on this host and may take the job's tokens (including the artifact token): no cache,
      # no trusted decision after it. The job fails when checks fail, which is what lets `publish` set a green status;
      # the reports are untrusted data that publish turns into results.json.
      - name: "head: baseline coverage (only when a Bot commit exists)"
        if: env.FINAL_SHA != env.HEAD_SHA
        continue-on-error: true
        run: trusted/.github/scripts/workflow/verify.sh checks head "$REPORTS/baseline"
      - name: "final: typecheck and suites with coverage"
        run: trusted/.github/scripts/workflow/verify.sh checks final "$REPORTS/final"
      # The Defect tests run once on a copy of the final tree, with no network where the runner allows it. They fail on
      # purpose, so this step never changes the job result; publish reads its report to prove each Defect.
      - name: "final: Defect tests (information only)"
        if: ${{ !cancelled() && needs.bot_commit.outputs.defects == 'true' }}
        continue-on-error: true
        run: trusted/.github/scripts/workflow/verify.sh defects final "$REPORTS/final" "$OUT/defects"
      - name: "final: mutation (information only)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: trusted/.github/scripts/workflow/verify.sh mutation final "$REPORTS/final" "$OUT/scope.json"
      - name: Upload the raw reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: ${{ env.REPORTS }}
          include-hidden-files: true
          if-no-files-found: ignore

  # Runs after upstream failures too (not after a cancel by a newer push), so a crash still ends in a red status and comments.
  publish:
    name: "Publish: test-agent/verify status and comments"
    needs: [intake, scope, agents, bot_commit, suites]
    if: ${{ !cancelled() && needs.scope.result != 'skipped' && needs.scope.outputs.stop != 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, statuses: write, pull-requests: write }
    steps:
      - name: Check out base branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.base_sha || needs.intake.outputs.base_ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      # One download per artifact, only when its producer succeeded. Artifact names are unique per run and immutable
      # (upload-artifact v4+), so `suites`, which runs PR code and holds an artifact token, cannot upload a name that a
      # successful producer already used. `reports` is the one artifact `suites` makes; it is untrusted.
      - name: Download scope
        if: needs.scope.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: scope, path: "${{ env.OUT }}" }
      - name: Download the agents' output
        if: needs.agents.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: agents, path: "${{ env.OUT }}" }
      - name: Download checked
        if: needs.bot_commit.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: checked, path: "${{ env.OUT }}" }
      - name: Download the Defect tests
        if: needs.bot_commit.outputs.defects == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: defects, path: "${{ env.OUT }}/defects" }
      - name: Download the raw reports (untrusted)
        if: needs.suites.result == 'success' || needs.suites.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: reports, path: "${{ env.OUT }}/reports" }
      # Reads PR-written files with a trusted script that keeps only numbers and known labels. If it fails, there are
      # no results and the status is red. The suites job result, not this file, lets the status be green.
      - name: Write results.json
        continue-on-error: true
        run: |
          [ -d "$OUT/reports" ] || { echo "no reports artifact"; exit 0; }
          base=()
          [ -d "$OUT/reports/baseline" ] && base=(--baseline-tree "$GITHUB_WORKSPACE/head")
          node .github/scripts/workflow/results.ts "$OUT/reports" --final-tree "$GITHUB_WORKSPACE/final" "${base[@]}" --out "$OUT/results.json"
      # A Defect is proven when its test failed with an assertion that shows the Author's values. Without a report, or
      # when this step fails, every Defect stays unproven and does not turn the status red.
      - name: Decide which Defects are proven
        if: needs.bot_commit.outputs.defects == 'true'
        continue-on-error: true
        run: node .github/scripts/workflow/defect-proof.ts decide "$OUT/defects/defects.json" --reports "$OUT/reports/final" --out "$OUT/proof.json"
      - name: Write context.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.intake.outputs.pr }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/workflow/context.ts --out "$OUT/context.json"
          jq -r '"Job results: " + (.jobs | to_entries | map("\(.key) \(.value)") | join(", "))' "$OUT/context.json"
      - name: Post the status and comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/workflow/report.ts --dir "$OUT" --post
